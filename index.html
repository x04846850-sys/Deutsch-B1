<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELC B1 Prüfungsvorbereitung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🇩🇪 TELC B1 Prüfungsvorbereitung</h1>
    </header>

    <main class="container">
        <section class="card">
            <h2>📚 Wortschatz des Tages (Kun lug'ati)</h2>
            <p id="word-box">Lade Wort...</p>
            <button onclick="nextWord()">Nächster Begriff</button>
        </section>

        <section class="card">
            <h2>✍️ Sprachbausteine Übung</h2>
            <p>Wählen Sie das richtige Wort:</p>
            <p>Ich passe auf die Kinder ____. (auf / an / für)</p>
            <button onclick="checkAnswer('auf')">auf</button>
            <button onclick="checkAnswer('an')">an</button>
            <button onclick="checkAnswer('für')">für</button>
            <p id="feedback"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
